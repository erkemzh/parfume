<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Ambient Luxury Glow -->
  <circle cx="256" cy="220" r="140" fill="url(#glowGrad)" filter="blur(30px)"/>

  <!-- Perfume Flacon Cap -->
  <path d="M256 90 L280 115 L268 135 L244 135 L232 115 Z" fill="url(#goldGrad)" stroke="#121214" stroke-width="2"/>
  <rect x="242" y="135" width="28" height="18" rx="3" fill="url(#goldGrad)"/>

  <!-- Perfume Flacon Body -->
  <path d="M220 155 L292 155 L330 205 L300 315 L212 315 L182 205 Z" fill="#1C1A24" stroke="url(#goldGrad)" stroke-width="6"/>
  <path d="M256 155 L256 315" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M182 205 L256 240 L330 205" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Liquid Reflection -->
  <path d="M228 245 L284 245 L292 305 L220 305 Z" fill="url(#goldGrad)" fill-opacity="0.15"/>

  <!-- Text "AURA NOIR" -->
  <text x="256" y="380" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="42" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">AURA NOIR</text>
  <text x="256" y="415" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="500" letter-spacing="6" fill="#A1A1AA" text-anchor="middle">PARIS · GRASSE</text>
</svg>
